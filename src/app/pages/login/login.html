<div class="login-container">
    <div class="login-card">
        <!-- Logo / Título -->
        <div class="login-header">
            <div class="logo-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z" />
                    <path d="M2 17l10 5 10-5" />
                    <path d="M2 12l10 5 10-5" />
                </svg>
            </div>
            <h1>Sistema de Recaudación</h1>
            <h2>Agua Potable</h2>
            <p class="subtitle">Municipalidad de Santa Bárbara</p>
        </div>

        <!-- Formulario -->
        <form (ngSubmit)="onSubmit()" class="login-form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="admin@municipalidad.com"
                    required autocomplete="email" />
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••"
                    required autocomplete="current-password" />
            </div>

            <div *ngIf="error" class="error-message">
                ⚠️ {{ error }}
            </div>

            <button type="submit" class="btn-primary" [disabled]="isLoading">
                <span *ngIf="!isLoading">Iniciar Sesión</span>
                <span *ngIf="isLoading">Cargando...</span>
            </button>
        </form>

        <div class="login-footer">
            <p>Sistema de Gestión de Agua Potable</p>
            <p class="version">v1.0.0</p>
        </div>
    </div>
</div>
